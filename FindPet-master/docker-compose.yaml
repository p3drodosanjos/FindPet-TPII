version: '3.8'

services:
findpet-webapp:
  build: .
  ports:
    - "8081:8080"
  environment:
    - ConnectionStrings__MongoDb=mongodb://mongo-db:27017/FindPetDB
  depends_on:
    - mongo-db

mongo-db:
  image: mongo:latest
  ports:
    - "27017:27017"
  volumes:
    - mongodb-data:/data/db

volumes:
  mongodb-data: